# Builds Crate.vst3 with no toolchain on the developer's machine: CMake fetches the
# Steinberg VST3 SDK itself, plus its four needed submodules. A tagged push attaches the
# bundle to a GitHub Release, which is how it gets installed into a DAW.
#
# The core job needs no SDK at all and is the fast regression signal; the Windows job is
# the one that produces the installable bundle.
name: build-vst3

on:
  push:
    branches:
      - 'cline/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# The release step creates a Release, so the default read-only token is not enough.
permissions:
  contents: write

env:
  # Must be a real Steinberg tag: v<major>.<minor>.<patch>_build_<n>.
  VST3_SDK_TAG: v3.7.11_build_10

jobs:
  # ---------------------------------------------------------------------------------
  # The SDK-free suite: scripts/build-tests.sh compiles everything under source/ and
  # tests/ except the SDK-facing layers (source/vst3, tests/integration) and runs it.
  # ---------------------------------------------------------------------------------
  core-tests:
    name: core tests (SDK-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run the SDK-free suite
        run: |
          bash vst3-container/scripts/build-tests.sh > /tmp/core.log 2>&1 || code=$?
          code=${code:-0}
          cat /tmp/core.log
          if [ "$code" -ne 0 ]; then
            tail -40 /tmp/core.log | sed 's/^/::error::/'
            exit "$code"
          fi

  # ---------------------------------------------------------------------------------
  # The plug-in itself. Crate.vst3 is the deliverable; the integration check and the
  # SDK validator are what stop a bundle that a host would blacklist from shipping.
  # ---------------------------------------------------------------------------------
  vst3-windows:
    name: Crate.vst3 (windows x64)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the VST3 SDK (${{ env.VST3_SDK_TAG }}, shallow)
        shell: pwsh
        run: |
          ./.github/scripts/run-step.ps1 -- git clone --depth 1 --branch ${{ env.VST3_SDK_TAG }} https://github.com/steinbergmedia/vst3sdk.git '${{ runner.temp }}/vst3sdk'
          foreach ($module in 'base', 'pluginterfaces', 'public.sdk', 'cmake') {
            ./.github/scripts/run-step.ps1 -- git -C '${{ runner.temp }}/vst3sdk' submodule update --init --depth 1 $module
          }

      - name: Configure (against the checked-out SDK)
        shell: pwsh
        timeout-minutes: 15
        run: |
          ./.github/scripts/run-step.ps1 -Annotate -- cmake -S vst3-container -B build -A x64 '-DCRATE_VST3_SDK_DIR=${{ runner.temp }}/vst3sdk'

      - name: Build the plug-in, the fixture plug-in and the tests
        shell: pwsh
        timeout-minutes: 30
        run: |
          ./.github/scripts/run-step.ps1 -Annotate -- cmake --build build --config Release --target Crate crate_core CrateGainFixture crate_hosting_check crate_tests

      - name: SDK-free unit suite
        shell: pwsh
        run: |
          ./.github/scripts/run-step.ps1 -- ctest --test-dir build -C Release -R crate_tests --output-on-failure

      - name: Hosting integration check (loads a real bundle through the container)
        shell: pwsh
        run: |
          $exe = Get-ChildItem build -Recurse -Filter crate_hosting_check.exe |
                 Select-Object -First 1
          $fixture = Get-ChildItem build -Recurse -Directory -Filter CrateGainFixture.vst3 |
                     Select-Object -First 1
          if (-not $exe)     { throw 'crate_hosting_check.exe was not built' }
          if (-not $fixture) { throw 'the CrateGainFixture.vst3 bundle was not built' }
          Write-Host "fixture bundle: $($fixture.FullName)"
          & $exe.FullName $fixture.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "hosting check failed with exit code $LASTEXITCODE"
          }

      - name: Build the SDK validator
        continue-on-error: true
        shell: pwsh
        run: |
          ./.github/scripts/run-step.ps1 -- cmake --build build --config Release --target validator

      - name: Validate Crate.vst3 (informational)
        continue-on-error: true
        shell: pwsh
        run: |
          $plugin = Get-ChildItem build -Recurse -Directory -Filter Crate.vst3 |
                    Select-Object -First 1
          $validator = Get-ChildItem build -Recurse -Filter validator.exe |
                       Select-Object -First 1
          if (-not $plugin)    { throw 'Crate.vst3 was not built' }
          if (-not $validator) { throw 'the SDK validator was not built' }
          Write-Host "validating: $($plugin.FullName)"
          & $validator.FullName $plugin.FullName

      - name: Stage the bundle and write INSTALL.txt
        shell: pwsh
        run: |
          $plugin = Get-ChildItem build -Recurse -Directory -Filter Crate.vst3 |
                    Select-Object -First 1
          if (-not $plugin) { throw 'Crate.vst3 was not built' }
          $stage = Join-Path $env:RUNNER_TEMP 'crate-dist'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item -Recurse $plugin.FullName $stage
          $lines = @(
            'Crate - VST3 plugin browser and container',
            'built from branch cline/mbpp33tp',
            '',
            'Install:',
            '  1. the Crate.vst3 folder in this archive goes into',
            '     %ProgramFiles%\Common Files\VST3\',
            '  2. rescan plugins in the DAW (a container that does not appear is',
            '     almost always the wrong folder or a host that has not rescanned).',
            '',
            'What to expect at this stage:',
            '  * the editor is not implemented yet (createView() returns nullptr), so the',
            '    host shows its generic parameter list instead of the card grid;',
            '  * audio passes through bit-transparent when no plugin is loaded;',
            '  * a slot loads the plugins named in the session state, in series.'
          )
          $lines | Set-Content -Encoding utf8 (Join-Path $stage 'INSTALL.txt')
          $zip = Join-Path $env:RUNNER_TEMP 'Crate-windows-x64.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
          Write-Host "staged: $zip"
          Get-ChildItem -Recurse $plugin.FullName | Select-Object -ExpandProperty FullName

      - name: Hand the bundle to the run page
        uses: actions/upload-artifact@v4
        with:
          name: Crate-windows-x64
          path: ${{ runner.temp }}/Crate-windows-x64.zip
          if-no-files-found: error

      - name: Attach the bundle to the Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/Crate-windows-x64.zip
          fail_on_unmatched_files: true
          name: Crate ${{ github.ref_name }}
          body: |
            Crate.vst3 for 64-bit Windows, built from ${{ github.sha }}.

            Install: unpack Crate.vst3 into `%ProgramFiles%\Common Files\VST3\`, then
            rescan plugins in the DAW.

            Known limitation at this stage: `createView()` returns `nullptr`, so the host
            shows its generic parameter list instead of the card grid. The hosting engine,
            registry readers, state codec and crash journal are in place and unit-tested.
